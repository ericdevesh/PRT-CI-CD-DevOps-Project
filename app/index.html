<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRT CI/CD Lab</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f7fb; color: #123047; }
    main { max-width: 760px; margin: 24px; padding: 44px 34px; background: white; border: 1px solid #dbe5ee; border-radius: 18px; box-shadow: 0 14px 40px #17324a12; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #d8f4e5; color: #13744b; font-size: 30px; }
    h1 { margin: 22px 0 12px; font-size: clamp(1.6rem, 5vw, 2.5rem); letter-spacing: -0.04em; }
    p { color: #526579; line-height: 1.6; }
    code { background: #edf3f8; padding: 3px 7px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>PRT – CI/CD Completed Successfully</h1>
    <p>Git source control, Docker image build, Jenkins automation, and Kubernetes deployment demonstration.</p>
    <p>Application status: <code>Running</code></p>
  </main>
</body>
</html>
