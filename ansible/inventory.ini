[ci_master]
ci-master ansible_connection=local ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3

[ci_agent]
ci-agent ansible_host=REPLACE_WITH_CI_AGENT_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/lab.pem ansible_python_interpreter=/usr/bin/python3

[k8s_node]
k8s-node ansible_host=REPLACE_WITH_K8S_NODE_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/lab.pem ansible_python_interpreter=/usr/bin/python3
